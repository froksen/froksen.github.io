<!DOCTYPE html>
<html lang="da">
<head>

<title>Trigonometri &amp; Pythagoras — Interaktiv opgaveløsning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

    --paper-dim:#647d90;
    --ok:#1f8a54;
    --err:#c8402f;
    --ink:#1c3b52;

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{

  /* start screen */

  .pkg-list{ display:flex; flex-direction:column; gap:12px; }
  .pkg-card{

    width:100%;
    text-align:left;

  /* help animation */

  @keyframes sqCycle{
    0%{ transform:scale(0); opacity:0; }
    18%{ transform:scale(1); opacity:0.85; }

<body>
<div class="sheet">

  <div class="letterhead">
    <h1>Trigonometri &amp; Pythagoras</h1>
    <span class="tag" id="taskTag">VÆLG PAKKE</span>
  </div>

  <div class="ticks" id="ticks"></div>

  <div class="card" id="card"></div>

  <div class="footer-note">Retvinklede trekanter · sinus, cosinus, tangens og Pythagoras</div>
</div>

<script>
/* ============================================================
   PAKKER
   ============================================================ */
const PACKAGES = {
  label:   { title:'Udpeg kateter og vinkler',    types:['label'],               desc:'20 opgaver uden beregning, hvor du skal udpege den modstående og hosliggende katete samt de tre vinkler i en retvinklet trekant. Nye opgaver hver gang.' },
  sin:     { title:'Sinus',                       types:['sin'],                 desc:'12 opgaver, hvor du skal bruge sinus til at finde en side eller en vinkel.' },
  cos:     { title:'Cosinus',                     types:['cos'],                 desc:'12 opgaver, hvor du skal bruge cosinus til at finde en side eller en vinkel.' },
  tan:     { title:'Tangens',                     types:['tan'],                 desc:'12 opgaver, hvor du skal bruge tangens til at finde en side eller en vinkel.' },
  pyth:    { title:'Pythagoras',                  types:['pyth'],                desc:'12 opgaver, hvor du skal bruge Pythagoras' + "'" + ' sætning til at finde en side.' },
  mix3:    { title:'Sinus, cosinus eller tangens', types:['sin','cos','tan'],     desc:'12 blandede opgaver, hvor du selv skal afgøre om det er sinus, cosinus eller tangens.' },
  mix4:    { title:'Alle fire metoder',            types:['sin','cos','tan','pyth'], desc:'12 blandede opgaver, hvor du selv skal afgøre om det er Pythagoras, sinus, cosinus eller tangens.' },
};
const PACKAGE_ORDER = ['label','sin','cos','tan','pyth','mix3','mix4'];

const daNames = { hyp:'hypotenusen', opposite:'den modstående katete', adjacent:'den hosliggende katete' };
const fnDaName = { sin:'sinus', cos:'cosinus', tan:'tangens', pyth:'Pythagoras' };

/* ============================================================
   OPGAVEGENERERING
   ============================================================ */
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function generateTrigQuestion(fn){
  const mode = Math.random() < 0.5 ? 'side' : 'angle';

  if(mode === 'side'){
    const angle = randInt(20,70);
    const rad = angle*Math.PI/180;
    const variant = Math.random() < 0.5 ? 'mult' : 'div';
    let givenRole, targetRole, givenVal, targetVal;

    if(fn === 'sin'){
      if(variant === 'mult'){ givenRole='hyp'; targetRole='opposite'; givenVal=randInt(8,30); targetVal=givenVal*Math.sin(rad); }
      else { givenRole='opposite'; targetRole='hyp'; givenVal=randInt(5,20); targetVal=givenVal/Math.sin(rad); }
    } else if(fn === 'cos'){
      if(variant === 'mult'){ givenRole='hyp'; targetRole='adjacent'; givenVal=randInt(8,30); targetVal=givenVal*Math.cos(rad); }
      else { givenRole='adjacent'; targetRole='hyp'; givenVal=randInt(5,20); targetVal=givenVal/Math.cos(rad); }
    } else {
      if(variant === 'mult'){ givenRole='adjacent'; targetRole='opposite'; givenVal=randInt(5,20); targetVal=givenVal*Math.tan(rad); }
      else { givenRole='opposite'; targetRole='adjacent'; givenVal=randInt(5,20); targetVal=givenVal/Math.tan(rad); }
    }

    return {
      kind:'trig', fn, mode, variant, angle, givenRole, givenVal, targetRole, targetVal,
      given: { [givenRole]: givenVal },
      targetUnit: 'cm',
      correctFn: fn,
      prompt: `Beregn ${daNames[targetRole]}, når vinkel A er ${angle}° og ${daNames[givenRole]} er ${givenVal} cm.`
    };
  }

  // mode === 'angle': two sides are given (integers), angle A is the unknown
  let role1, val1, role2, val2, targetVal;
  if(fn === 'sin'){
    role1 = 'opposite'; role2 = 'hyp';
    val2 = randInt(12,30); val1 = randInt(5, val2-4);
    targetVal = Math.asin(val1/val2) * 180/Math.PI;
  } else if(fn === 'cos'){
    role1 = 'adjacent'; role2 = 'hyp';
    val2 = randInt(12,30); val1 = randInt(5, val2-4);
    targetVal = Math.acos(val1/val2) * 180/Math.PI;
  } else {
    role1 = 'opposite'; role2 = 'adjacent';
    val1 = randInt(5,20); val2 = randInt(5,20);
    targetVal = Math.atan(val1/val2) * 180/Math.PI;
  }

  const given = { [role1]: val1, [role2]: val2 };
  const orderedRoles = ['opposite','adjacent','hyp'].filter(r => given[r] !== undefined);
  const phrase = orderedRoles.map(r => `${daNames[r]} er ${given[r]} cm`).join(' og ');

  return {
    kind:'trig', fn, mode, given, targetRole:'angleA', targetVal,
    targetUnit: '°',
    correctFn: fn,
    prompt: `Beregn vinkel A, når ${phrase}.`
  };
}

function generatePythQuestion(){
  const subtype = randInt(0,2);
  let given, targetRole, targetVal, prompt;

  if(subtype === 0){
    const a = randInt(5,22), b = randInt(5,22);
    targetVal = Math.sqrt(a*a + b*b);
    given = { opposite:a, adjacent:b };
    targetRole = 'hyp';
    prompt = `Beregn hypotenusen i den retvinklede trekant, når kateterne er ${a} cm og ${b} cm.`;
  } else if(subtype === 1){
    const hyp = randInt(15,35);
    const adjacent = randInt(5, hyp-3);
    targetVal = Math.sqrt(hyp*hyp - adjacent*adjacent);
    given = { hyp, adjacent };
    targetRole = 'opposite';
    prompt = `Beregn den manglende katete, når hypotenusen er ${hyp} cm og den ene katete er ${adjacent} cm.`;
  } else {
    const hyp = randInt(15,35);
    const opposite = randInt(5, hyp-3);
    targetVal = Math.sqrt(hyp*hyp - opposite*opposite);
    given = { hyp, opposite };
    targetRole = 'adjacent';
    prompt = `Beregn den manglende katete, når hypotenusen er ${hyp} cm og den ene katete er ${opposite} cm.`;
  }

  return { kind:'pyth', subtype, given, targetRole, targetVal, correctFn:'pyth', prompt };
}

function generateQuestionOfType(type){
  return type === 'pyth' ? generatePythQuestion() : generateTrigQuestion(type);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

/* ============================================================
   "UDPEG KATETER OG VINKLER" — pure identification drill
   (same right triangle, shown in a randomly rotated/mirrored
   orientation each time, so the student can't rely on screen position)
   ============================================================ */
const IDENTIFY_VARIANTS = [
  { A:{x:55,y:230},  B:{x:315,y:55},  C:{x:315,y:230} },
  { A:{x:315,y:230}, B:{x:55,y:55},   C:{x:55,y:230} },
  { A:{x:55,y:55},   B:{x:315,y:230}, C:{x:315,y:55} },
  { A:{x:315,y:55},  B:{x:55,y:230},  C:{x:55,y:55} },
];

/* the two acute vertices; C is always the right angle and has no single "adjacent/opposite" leg of its own */
function oppositeLeg(vertex){ return vertex === 'A' ? 'BC' : 'AC'; }
function adjacentLeg(vertex){ return vertex === 'A' ? 'AC' : 'BC'; }

const IDENTIFY_TEMPLATES = [
  { build: () => {
      const v = Math.random() < 0.5 ? 'A' : 'B';
      return { prompt:`Hvilken katete er den modstående til vinkel ${v}?`, qType:'side', correct: oppositeLeg(v) };
    }
  },
  { build: () => {
      const v = Math.random() < 0.5 ? 'A' : 'B';
      return { prompt:`Hvilken katete er den hosliggende til vinkel ${v}?`, qType:'side', correct: adjacentLeg(v) };
    }
  },
  { prompt:'Hvilken side er hypotenusen?', qType:'side', correct:'AB' },
  { prompt:'Hvilken vinkel er den rette vinkel?', qType:'angle', correct:'C' },
  { prompt:'Hvilken vinkel ligger overfor siden |BC|?', qType:'angle', correct:'A' },
  { prompt:'Hvilken vinkel ligger overfor siden |AC|?', qType:'angle', correct:'B' },
  { prompt:'Hvilken vinkel ligger overfor hypotenusen (|AB|)?', qType:'angle', correct:'C' },
  { prompt:'Hvilken side ligger overfor vinkel A?', qType:'side', correct:'BC' },
  { prompt:'Hvilken side ligger overfor vinkel B?', qType:'side', correct:'AC' },
  { prompt:'Hvilken side ligger overfor vinkel C?', qType:'side', correct:'AB' },
];

function resolveTemplate(t){
  return t.build ? t.build() : t;
}

function generateIdentifySet(){
  const doubled = IDENTIFY_TEMPLATES.concat(IDENTIFY_TEMPLATES);
  return shuffle(doubled.map(t => {
    const resolved = resolveTemplate(t);
    return {
      kind:'label',
      qType: resolved.qType,
      prompt: resolved.prompt,
      correct: resolved.correct,
      options: shuffle(resolved.qType === 'side' ? ['AB','BC','AC'] : ['A','B','C']),
      variant: randInt(0, IDENTIFY_VARIANTS.length-1),
    };
  }));
}

function buildQuestionSet(pkgKey){
  if(pkgKey === 'label') return generateIdentifySet();

  const types = PACKAGES[pkgKey].types;
  const qs = [];
  for(let i=0;i<12;i++){
    qs.push(generateQuestionOfType(types[i % types.length]));
  }
  shuffle(qs);

  // in mixed packages, at least 1/4 of the questions must first have the student
  // identify which sides/angle are known and which is to be found, before choosing a method —
  // and the very first question of the set is always one of these, so every attempt starts with it
  if(types.length > 1){
    const identifyCount = Math.ceil(qs.length / 4);
    const rest = shuffle(qs.map((_,i)=>i).filter(i => i !== 0)).slice(0, identifyCount - 1);
    const idx = [0, ...rest];
    idx.forEach(i => { qs[i].needsIdentify = true; });
  }

  return qs;
}

/* ============================================================
   STATE
   ============================================================ */
let currentPkgKey = null;
let questions = [];
let qIndex = 0;
let wrongCount = 0;
let helpShown = false;
let results = []; // per-question stats: { attempts, skipped }

const card = document.getElementById('card');
const ticksEl = document.getElementById('ticks');
const taskTag = document.getElementById('taskTag');

/* ============================================================
   SVG DIAGRAM
   ============================================================ */
function sideRoleData(q, role){
  // returns {state:'given'|'target'|'plain', value:number|null}
  if(role === q.targetRole) return { state:'target', value:null };
  if(q.given && q.given[role] !== undefined) return { state:'given', value:q.given[role] };
  return { state:'plain', value:null };
}

/* angle A's display state: 'none' (pythagoras, no angle shown), 'given' (known angle), or 'target' (angle is the unknown) */
function angleState(q){
  if(q.kind !== 'trig') return { state:'none' };
  if(q.targetRole === 'angleA') return { state:'target', value:null };
  return { state:'given', value:q.angle };
}

/* generic vector helpers, used for the orientation-independent "label" package diagram */
function vSub(P,Q){ return {x:P.x-Q.x, y:P.y-Q.y}; }
function vAdd(P,Q){ return {x:P.x+Q.x, y:P.y+Q.y}; }
function vScale(v,s){ return {x:v.x*s, y:v.y*s}; }
function vUnit(v){ const l = Math.hypot(v.x,v.y) || 1; return {x:v.x/l, y:v.y/l}; }

function rightAngleMarker(C,P1,P2,size){
  const uA = vUnit(vSub(P1,C)), uB = vUnit(vSub(P2,C));
  const p1 = C, p2 = vAdd(C, vScale(uA,size)), p3 = vAdd(p2, vScale(uB,size)), p4 = vAdd(C, vScale(uB,size));
  const pts = [p1,p2,p3,p4].map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  return `<polygon points="${pts}" fill="none" stroke="var(--paper-dim)" stroke-width="1.5"/>`;
}

function labelVertexPos(P, centroid, dist){
  const d = vSub(P, centroid);
  const u = vUnit(d);
  return { x: P.x + u.x*dist, y: P.y + u.y*dist };
}

/* draws the plain (unlabelled sides) triangle used by the "udpeg kateter og vinkler" package.
   revealKey, if set to a side ('AB'/'BC'/'AC') or angle ('A'/'B'/'C'), highlights it in green
   once the student has answered correctly. */
function labelTriangleSVG(q, revealKey){
  const { A, B, C } = IDENTIFY_VARIANTS[q.variant];
  const centroid = { x:(A.x+B.x+C.x)/3, y:(A.y+B.y+C.y)/3 };

  function sideColor(key){ return (revealKey === key) ? 'var(--ok)' : 'var(--cyan)'; }
  function sideWidth(key){ return (revealKey === key) ? 3.5 : 2.5; }
  function vertexColor(key){ return (revealKey === key) ? 'var(--ok)' : 'var(--paper-dim)'; }

  const posA = labelVertexPos(A, centroid, 22);
  const posB = labelVertexPos(B, centroid, 22);
  const posC = labelVertexPos(C, centroid, 22);

  return `
  <svg viewBox="0 0 400 300" width="100%" height="260">
    <line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${sideColor('AB')}" stroke-width="${sideWidth('AB')}"/>
    <line x1="${B.x}" y1="${B.y}" x2="${C.x}" y2="${C.y}" stroke="${sideColor('BC')}" stroke-width="${sideWidth('BC')}"/>
    <line x1="${A.x}" y1="${A.y}" x2="${C.x}" y2="${C.y}" stroke="${sideColor('AC')}" stroke-width="${sideWidth('AC')}"/>

    ${rightAngleMarker(C, A, B, 13)}

    <text x="${posA.x}" y="${posA.y}" text-anchor="middle" font-size="16" fill="${vertexColor('A')}" font-weight="700">A</text>
    <text x="${posB.x}" y="${posB.y}" text-anchor="middle" font-size="16" fill="${vertexColor('B')}" font-weight="700">B</text>
    <text x="${posC.x}" y="${posC.y}" text-anchor="middle" font-size="16" fill="${vertexColor('C')}" font-weight="700">C</text>

    <circle cx="${A.x}" cy="${A.y}" r="3" fill="var(--paper)"/>
    <circle cx="${B.x}" cy="${B.y}" r="3" fill="var(--paper)"/>
    <circle cx="${C.x}" cy="${C.y}" r="3" fill="var(--paper)"/>
  </svg>`;
}

/* vertex name labels — A (given angle / bottom-left), B (top), C (right angle / bottom-right) */
function vertexLabels(A, R, T, offset){
  offset = offset || 16;
  return `
    <text x="${A.x-offset}" y="${A.y+offset}" text-anchor="middle" font-size="${offset<14?12:14}" fill="var(--paper-dim)" font-weight="700">A</text>
    <text x="${R.x+offset-2}" y="${R.y+offset+2}" text-anchor="middle" font-size="${offset<14?12:14}" fill="var(--paper-dim)" font-weight="700">C</text>
    <text x="${T.x+offset-6}" y="${T.y-offset+8}" text-anchor="middle" font-size="${offset<14?12:14}" fill="var(--paper-dim)" font-weight="700">B</text>
  `;
}

function triangleSVG(q){
  const A = {x:55, y:230};
  const R = {x:315, y:230};
  const T = {x:315, y:55};

  function labelFor(state, value, x, y, anchor){
    let text, color;
    if(state === 'given'){ text = value + ' cm'; color = 'var(--cyan)'; }
    else if(state === 'target'){ text = '?'; color = 'var(--amber)'; }
    else { return ''; }
    return `<text x="${x}" y="${y}" text-anchor="${anchor}" font-size="15" fill="${color}" font-weight="600">${text}</text>`;
  }

  const hypData = sideRoleData(q,'hyp');
  const oppData = sideRoleData(q,'opposite');
  const adjData = sideRoleData(q,'adjacent');

  function strokeFor(state){
    if(state === 'target') return { color:'var(--amber)', dash:'6,4' };
    if(state === 'given')  return { color:'var(--cyan)', dash:'0' };
    return { color:'var(--cyan-dim)', dash:'0' };
  }
  const hypStroke = strokeFor(hypData.state);
  const oppStroke = strokeFor(oppData.state);
  const adjStroke = strokeFor(adjData.state);

  const oppLabel = labelFor(oppData.state, oppData.value, 335, 145, 'start');
  const adjLabel = labelFor(adjData.state, adjData.value, 185, 258, 'middle');

  let hypLabel = '';
  if(hypData.state === 'given' || hypData.state === 'target'){
    const midx = (A.x+T.x)/2 - 18, midy = (A.y+T.y)/2;
    const angleDeg = Math.round(Math.atan2(A.y-T.y, T.x-A.x)*180/Math.PI);
    const text = hypData.state === 'given' ? (hypData.value+' cm') : '?';
    const color = hypData.state === 'given' ? 'var(--cyan)' : 'var(--amber)';
    hypLabel = `<text x="${midx}" y="${midy}" text-anchor="middle" font-size="15" fill="${color}" font-weight="600" transform="rotate(-${angleDeg} ${midx} ${midy})">${text}</text>`;
  }

  let angleArc = '';
  const angState = angleState(q);
  if(angState.state !== 'none'){
    const isTarget = angState.state === 'target';
    const arcColor = isTarget ? 'var(--amber)' : 'var(--cyan)';
    const arcDash = isTarget ? '4,3' : '0';
    const arcText = isTarget ? '?' : `${angState.value}°`;
    angleArc = `
      <path d="M ${A.x+26} ${A.y} A 26 26 0 0 0 ${A.x+20} ${A.y-16}" fill="none" stroke="${arcColor}" stroke-width="1.5" stroke-dasharray="${arcDash}"/>
      <text x="${A.x+34}" y="${A.y-8}" font-size="14" fill="${arcColor}" font-weight="600">${arcText}</text>`;
  }

  return `
  <svg viewBox="0 0 400 300" width="100%" height="260">
    <line x1="${A.x}" y1="${A.y}" x2="${T.x}" y2="${T.y}" stroke="${hypStroke.color}" stroke-width="2.5" stroke-dasharray="${hypStroke.dash}"/>
    <line x1="${A.x}" y1="${A.y}" x2="${R.x}" y2="${R.y}" stroke="${adjStroke.color}" stroke-width="2.5" stroke-dasharray="${adjStroke.dash}"/>
    <line x1="${R.x}" y1="${R.y}" x2="${T.x}" y2="${T.y}" stroke="${oppStroke.color}" stroke-width="2.5" stroke-dasharray="${oppStroke.dash}"/>

    <rect x="${R.x-14}" y="${R.y-14}" width="14" height="14" fill="none" stroke="var(--paper-dim)" stroke-width="1.5"/>

    ${angleArc}

    ${hypLabel}
    ${oppLabel}
    ${adjLabel}
    ${vertexLabels(A,R,T)}

    <circle cx="${A.x}" cy="${A.y}" r="3" fill="var(--paper)"/>
    <circle cx="${R.x}" cy="${R.y}" r="3" fill="var(--paper)"/>
    <circle cx="${T.x}" cy="${T.y}" r="3" fill="var(--paper)"/>
  </svg>`;
}

/* ============================================================
   START SCREEN
   ============================================================ */
function renderStart(){
  taskTag.textContent = 'VÆLG PAKKE';
  ticksEl.innerHTML = '';

  let html = `<div class="task-label">TRIGONOMETRI &amp; PYTHAGORAS</div>`;
  html += `<h2 class="prompt">Vælg en opgavepakke</h2>`;
  html += `<p class="intro">Hver pakke indeholder 12 opgaver med retvinklede trekanter. Alle oplysninger i opgaverne er hele tal, men svarene kræver ofte en lommeregner.</p>`;
  html += `<div class="pkg-list">`;
  PACKAGE_ORDER.forEach((key,i)=>{
    const p = PACKAGES[key];
    html += `<a class="pkg-card" href="#${key}">
      <div class="pkg-tag">PAKKE ${i+1}</div>
      <div class="pkg-title">${p.title}</div>
      <div class="pkg-desc">${p.desc}</div>
    </a>`;
  });
  html += `</div>`;
  card.innerHTML = html;
}

/* renders the start screen and clears any package state (called via hash routing) */
function goHome(){
  currentPkgKey = null;
  renderStart();
}

/* activates a package and renders its first question (called via hash routing or retry) */
function activatePackage(pkgKey){
  currentPkgKey = pkgKey;
  questions = buildQuestionSet(pkgKey);
  qIndex = 0;
  results = [];
  renderQuestion();
}

/* ============================================================
   URL HASH ROUTING — lets a package be linked to directly,
   e.g. mysite.github.io/opgave.html#sin, bypassing the start screen.
   ============================================================ */
function syncFromHash(){
  const key = decodeURIComponent(location.hash.replace(/^#/, ''));
  if(key && PACKAGES[key]){
    activatePackage(key);
  } else {
    goHome();
  }
}

/* ============================================================
   PROGRESS TICKS
   ============================================================ */
function renderTicks(){
  ticksEl.innerHTML = '';
  questions.forEach((q,i)=>{
    const t = document.createElement('div');
    t.className = 'tick';
    if(i < qIndex) t.classList.add('done');
    else if(i === qIndex) t.classList.add('current');
    ticksEl.appendChild(t);
  });
}

/* ============================================================
   RENDER QUESTION
   ============================================================ */
function renderQuestion(){
  const q = questions[qIndex];
  taskTag.textContent = PACKAGES[currentPkgKey].title.toUpperCase();
  renderTicks();
  wrongCount = 0;
  helpShown = false;
  buildCard(q);
}

function fnButtonsForPackage(){
  const includesPyth = PACKAGES[currentPkgKey].types.includes('pyth');
  const base = [
    {fn:'sin', label:'Sinus'},
    {fn:'cos', label:'Cosinus'},
    {fn:'tan', label:'Tangens'},
  ];
  if(includesPyth) base.push({fn:'pyth', label:'Pythagoras'});
  return shuffle(base.slice());
}

/* build the multiple-choice options for "what do you know / what must you find" */
function buildIdentifyOptions(q){
  let parts, correctKey;

  if(q.kind === 'pyth'){
    const roles = ['hyp','opposite','adjacent'];
    parts = roles.map(r => ({ key:r, label:daNames[r] }));
    correctKey = q.targetRole;
  } else if(q.mode === 'angle'){
    const sideRoles = Object.keys(q.given);
    parts = [
      { key:sideRoles[0], label:daNames[sideRoles[0]] },
      { key:sideRoles[1], label:daNames[sideRoles[1]] },
      { key:'angleA', label:'vinkel A' },
    ];
    correctKey = 'angleA';
  } else {
    parts = [
      { key:'angleA', label:'vinkel A' },
      { key:q.givenRole, label:daNames[q.givenRole] },
      { key:q.targetRole, label:daNames[q.targetRole] },
    ];
    correctKey = q.targetRole;
  }

  const options = parts.map(targetPart => {
    const knowns = parts.filter(p => p.key !== targetPart.key);
    return {
      text: `Jeg kender ${knowns[0].label} og ${knowns[1].label}. Jeg skal finde ${targetPart.label}.`,
      correct: targetPart.key === correctKey
    };
  });
  return shuffle(options);
}

function methodStepHTML(stepNum){
  let html = `<div class="step-label">TRIN ${stepNum} — VÆLG METODE</div>`;
  html += `<div class="fn-choices" id="fnChoices">`;
  fnButtonsForPackage().forEach(b=>{
    html += `<button class="fn-btn" data-fn="${b.fn}">${b.label}</button>`;
  });
  html += `</div>`;
  html += `<div class="feedback" id="fnFeedback"></div>`;
  html += `<div id="step2Wrap"></div>`;
  return html;
}

function attachMethodStepHandlers(q){
  document.querySelectorAll('#fnChoices .fn-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> handleFnChoice(btn, q));
  });
}

function commonTrailerHTML(){
  let html = `<div class="attempt-info" id="attemptInfo"></div>`;
  html += `<div class="secondary-actions">`;
  html += `<button class="help-trigger" id="helpTrigger">Få hjælp</button>`;
  html += `<button class="skip-trigger" id="skipTrigger">Spring opgaven over</button>`;
  html += `</div>`;
  html += `<div class="helpbox" id="helpBox"></div>`;
  html += `<div class="next-row" id="nextRow"><button class="next-btn" id="nextBtn">Næste spørgsmål →</button></div>`;
  return html;
}

function attachCommonTrailerHandlers(q){
  document.getElementById('helpTrigger').addEventListener('click', ()=> toggleHelp(q));
  document.getElementById('skipTrigger').addEventListener('click', ()=> handleSkip(q));
  document.getElementById('nextBtn').addEventListener('click', goNext);
  updateAttemptUI();
}

function buildCard(q){
  if(q.kind === 'label') return buildLabelCard(q);

  const isSingleMethod = PACKAGES[currentPkgKey].types.length === 1;

  let html = `<div class="task-label">SPØRGSMÅL ${qIndex+1} AF ${questions.length}</div>`;
  html += `<h2 class="prompt">${q.prompt}</h2>`;
  html += `<div class="diagram">${triangleSVG(q)}</div>`;
  html += `<div class="diagram-note">Trekanten er ikke tegnet i målestok.</div>`;

  if(isSingleMethod){
    html += `<div class="formula-box">${formulaFor(q)}</div>`;
    html += `<div id="step2Wrap">${stepTwoMarkup(q)}</div>`;
  } else if(q.needsIdentify){
    html += `<div class="step-label">TRIN 1 — HVAD KENDER DU, OG HVAD SKAL DU FINDE?</div>`;
    html += `<div class="fn-choices identify-choices" id="identifyChoices">`;
    buildIdentifyOptions(q).forEach((opt,i)=>{
      html += `<button class="fn-btn identify-btn" data-correct="${opt.correct}">${opt.text}</button>`;
    });
    html += `</div>`;
    html += `<div class="feedback" id="identifyFeedback"></div>`;
    html += `<div id="methodWrap"></div>`;
  } else {
    html += methodStepHTML(1);
  }

  html += commonTrailerHTML();

  card.innerHTML = html;

  if(isSingleMethod){
    attachStepTwoHandlers(q);
  } else if(q.needsIdentify){
    document.querySelectorAll('#identifyChoices .fn-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> handleIdentifyChoice(btn, q));
    });
  } else {
    attachMethodStepHandlers(q);
  }
  attachCommonTrailerHandlers(q);
}

function buildLabelCard(q){
  let html = `<div class="task-label">SPØRGSMÅL ${qIndex+1} AF ${questions.length}</div>`;
  html += `<h2 class="prompt">${q.prompt}</h2>`;
  html += `<div class="diagram" id="labelDiagram">${labelTriangleSVG(q, null)}</div>`;
  html += `<div class="fn-choices" id="labelChoices">`;
  q.options.forEach(opt => {
    const label = q.qType === 'side' ? `|${opt}|` : opt;
    html += `<button class="fn-btn" data-value="${opt}">${label}</button>`;
  });
  html += `</div>`;
  html += `<div class="feedback" id="labelFeedback"></div>`;
  html += commonTrailerHTML();

  card.innerHTML = html;

  document.querySelectorAll('#labelChoices .fn-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> handleLabelChoice(btn, q));
  });
  attachCommonTrailerHandlers(q);
}

function handleLabelChoice(btn, q){
  if(btn.disabled) return;
  const allBtns = document.querySelectorAll('#labelChoices .fn-btn');
  const fb = document.getElementById('labelFeedback');

  if(btn.dataset.value === q.correct){
    allBtns.forEach(b => b.disabled = true);
    btn.classList.add('correct');
    fb.textContent = 'Rigtigt!';
    fb.className = 'feedback ok';

    const diagram = document.getElementById('labelDiagram');
    if(diagram) diagram.innerHTML = labelTriangleSVG(q, q.correct);

    results[qIndex] = { attempts: wrongCount + 1, skipped:false };
    document.getElementById('nextRow').classList.add('show');
    document.getElementById('skipTrigger').classList.remove('show');
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    fb.textContent = 'Forkert — prøv igen.';
    fb.className = 'feedback err';
    setTimeout(()=> btn.classList.remove('wrong'), 600);
    updateAttemptUI();
  }
}

function handleIdentifyChoice(btn, q){
  if(btn.disabled) return;
  const allBtns = document.querySelectorAll('#identifyChoices .fn-btn');
  const fb = document.getElementById('identifyFeedback');

  if(btn.dataset.correct === 'true'){
    allBtns.forEach(b => b.disabled = true);
    btn.classList.add('correct');
    fb.textContent = 'Rigtigt — nu ved du, hvad der er kendt, og hvad du skal finde.';
    fb.className = 'feedback ok';
    document.getElementById('methodWrap').innerHTML = methodStepHTML(2);
    attachMethodStepHandlers(q);
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    fb.textContent = 'Ikke helt — kig igen på hvilke tal du får oplyst, og hvad opgaven spørger efter.';
    fb.className = 'feedback err';
    setTimeout(()=> btn.classList.remove('wrong'), 600);
    updateAttemptUI();
  }
}

function stepTwoMarkup(q){
  return `
    <div class="answer-row">
      <input type="text" inputmode="decimal" id="answerInput" placeholder="Dit svar">
      <span class="unit">${q.targetUnit || 'cm'}</span>
      <button class="submit-btn" id="submitBtn">Tjek</button>
    </div>
    <div class="feedback" id="ansFeedback"></div>
  `;
}

function attachStepTwoHandlers(q){
  const input = document.getElementById('answerInput');
  const btn = document.getElementById('submitBtn');
  btn.addEventListener('click', ()=> checkAnswer(q));
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter') checkAnswer(q); });
  input.focus();
}

/* ---------- step 1 ---------- */
function handleFnChoice(btn, q){
  if(btn.disabled) return;
  const allBtns = document.querySelectorAll('#fnChoices .fn-btn');
  const fb = document.getElementById('fnFeedback');

  if(btn.dataset.fn === q.correctFn){
    allBtns.forEach(b=> b.disabled = true);
    btn.classList.add('correct');
    fb.textContent = fnCorrectMessage(q);
    fb.className = 'feedback ok';
    const answerStepNum = q.needsIdentify ? 3 : 2;
    document.getElementById('step2Wrap').innerHTML =
      `<div class="step-label" style="margin-top:16px;">TRIN ${answerStepNum} — BEREGN SVARET</div>` +
      `<div class="formula-box">${formulaFor(q)}</div>` +
      stepTwoMarkup(q);
    attachStepTwoHandlers(q);
  } else {
    btn.classList.add('wrong');
    wrongCount++;
    fb.textContent = 'Det er ikke den rigtige metode her. Prøv igen.';
    fb.className = 'feedback err';
    setTimeout(()=> btn.classList.remove('wrong'), 600);
    updateAttemptUI();
  }
}

function fnCorrectMessage(q){
  if(q.kind === 'pyth'){
    return 'Rigtigt — når du kender to sider i en retvinklet trekant, bruger du Pythagoras' + "'" + ' sætning.';
  }
  if(q.targetRole === 'angleA'){
    return `Rigtigt — her bruger du ${fnDaName[q.fn]} (baglæns, med den omvendte funktion) til at finde vinkel A.`;
  }
  const roleName = q.targetRole === 'hyp' ? 'hypotenusen' : (q.targetRole === 'opposite' ? 'den modstående katete' : 'den hosliggende katete');
  return `Rigtigt — her bruger du ${fnDaName[q.fn]} til at finde ${roleName}.`;
}

function formulaFor(q){
  if(q.kind === 'pyth') return 'a² + b² = c²';
  return { sin:'sin(A) = modstående / hypotenuse', cos:'cos(A) = hosliggende / hypotenuse', tan:'tan(A) = modstående / hosliggende' }[q.fn];
}

/* ---------- step 2 ---------- */
function checkAnswer(q){
  const input = document.getElementById('answerInput');
  const fb = document.getElementById('ansFeedback');
  const raw = input.value.trim().replace(',', '.');
  const val = parseFloat(raw);

  if(isNaN(val)){
    fb.textContent = 'Skriv et tal.';
    fb.className = 'feedback err';
    return;
  }

  // sider: 0,15 cm eller 1 % (så afrunding undervejs, fx sin(35°) ≈ 0,57, ikke giver forkert)
  const tolerance = q.targetUnit === '°' ? 0.5 : Math.max(0.15, q.targetVal * 0.01);
  const correct = Math.abs(val - q.targetVal) < tolerance;

  if(correct){
    const unitSuffix = q.targetUnit === '°' ? '°' : ' cm';
    fb.textContent = `Korrekt — svaret er ca. ${q.targetVal.toFixed(1)}${unitSuffix}.`;
    fb.className = 'feedback ok';
    input.disabled = true;
    document.getElementById('submitBtn').disabled = true;

    // reveal the answer on the diagram
    const solvedQ = Object.assign({}, q);
    if(solvedQ.kind === 'trig'){ solvedQ.givenValDisplay = solvedQ.givenVal; }
    const diagram = card.querySelector('.diagram');
    if(diagram) diagram.innerHTML = triangleSolvedSVG(q);

    results[qIndex] = { attempts: wrongCount + 1, skipped:false };
    document.getElementById('nextRow').classList.add('show');
    document.getElementById('skipTrigger').classList.remove('show');
  } else {
    wrongCount++;
    fb.textContent = 'Ikke helt rigtigt. Tjek din beregning og prøv igen.';
    fb.className = 'feedback err';
    updateAttemptUI();
  }
}

function triangleSolvedSVG(q){
  // temporarily mark target as solved (shown in green) for the diagram
  const clone = Object.assign({}, q);
  const origTargetRole = clone.targetRole;
  const solvedValue = clone.targetVal;

  const A = {x:55, y:230}, R = {x:315, y:230}, T = {x:315, y:55};
  function roleData(role){
    if(role === origTargetRole) return { state:'solved', value: solvedValue.toFixed(1) };
    const d = sideRoleData(q, role);
    return d.state === 'given' ? { state:'given', value:d.value } : { state:'plain', value:null };
  }
  function colorFor(state){ return state==='solved' ? 'var(--ok)' : (state==='given' ? 'var(--cyan)' : 'var(--cyan-dim)'); }

  const hyp = roleData('hyp'), opp = roleData('opposite'), adj = roleData('adjacent');

  const oppLabel = opp.state!=='plain' ? `<text x="335" y="145" text-anchor="start" font-size="15" fill="${colorFor(opp.state)}" font-weight="600">${opp.value} cm</text>` : '';
  const adjLabel = adj.state!=='plain' ? `<text x="185" y="258" text-anchor="middle" font-size="15" fill="${colorFor(adj.state)}" font-weight="600">${adj.value} cm</text>` : '';
  let hypLabel = '';
  if(hyp.state!=='plain'){
    const midx=(A.x+T.x)/2-18, midy=(A.y+T.y)/2;
    const angleDeg = Math.round(Math.atan2(A.y-T.y,T.x-A.x)*180/Math.PI);
    hypLabel = `<text x="${midx}" y="${midy}" text-anchor="middle" font-size="15" fill="${colorFor(hyp.state)}" font-weight="600" transform="rotate(-${angleDeg} ${midx} ${midy})">${hyp.value} cm</text>`;
  }

  let angleArc = '';
  if(q.kind === 'trig'){
    const isAngleTarget = q.targetRole === 'angleA';
    const color = isAngleTarget ? 'var(--ok)' : 'var(--cyan)';
    const text = isAngleTarget ? `${q.targetVal.toFixed(1)}°` : `${q.angle}°`;
    angleArc = `
      <path d="M ${A.x+26} ${A.y} A 26 26 0 0 0 ${A.x+20} ${A.y-16}" fill="none" stroke="${color}" stroke-width="1.5"/>
      <text x="${A.x+34}" y="${A.y-8}" font-size="14" fill="${color}" font-weight="600">${text}</text>`;
  }

  return `
  <svg viewBox="0 0 400 300" width="100%" height="260">
    <line x1="${A.x}" y1="${A.y}" x2="${T.x}" y2="${T.y}" stroke="${colorFor(hyp.state)}" stroke-width="2.5"/>
    <line x1="${A.x}" y1="${A.y}" x2="${R.x}" y2="${R.y}" stroke="${colorFor(adj.state)}" stroke-width="2.5"/>
    <line x1="${R.x}" y1="${R.y}" x2="${T.x}" y2="${T.y}" stroke="${colorFor(opp.state)}" stroke-width="2.5"/>
    <rect x="${R.x-14}" y="${R.y-14}" width="14" height="14" fill="none" stroke="var(--paper-dim)" stroke-width="1.5"/>
    ${angleArc}
    ${hypLabel}${oppLabel}${adjLabel}
    ${vertexLabels(A,R,T)}
    <circle cx="${A.x}" cy="${A.y}" r="3" fill="var(--paper)"/>
    <circle cx="${R.x}" cy="${R.y}" r="3" fill="var(--paper)"/>
    <circle cx="${T.x}" cy="${T.y}" r="3" fill="var(--paper)"/>
  </svg>`;
}

/* ---------- attempts, help & skip ---------- */
const SKIP_THRESHOLD = 3;

function updateAttemptUI(){
  const info = document.getElementById('attemptInfo');
  const skipBtn = document.getElementById('skipTrigger');
  if(!info || !skipBtn) return;

  if(wrongCount >= SKIP_THRESHOLD){
    info.textContent = `Du har brugt ${wrongCount} forsøg — du kan nu springe opgaven over, hvis du vil.`;
    info.classList.add('ready');
    skipBtn.classList.add('show');
  } else {
    const remaining = SKIP_THRESHOLD - wrongCount;
    info.textContent = `Forsøg brugt: ${wrongCount} af ${SKIP_THRESHOLD}. ${remaining} forsøg mere, så kan du springe opgaven over.`;
    info.classList.remove('ready');
    skipBtn.classList.remove('show');
  }
}

function handleSkip(q){
  if(wrongCount < SKIP_THRESHOLD) return;
  results[qIndex] = { attempts: wrongCount, skipped:true };
  goNext();
}

function toggleHelp(q){
  const box = document.getElementById('helpBox');
  helpShown = !helpShown;
  box.classList.toggle('show', helpShown);
  if(helpShown) box.innerHTML = `<div class="help-diagram">${helpDiagram(q)}</div>` + helpText(q);
}

/* generic outward square for the Pythagoras animation (works for any two points + an opposite vertex) */
function outwardSquare(P1, P2, oppVertex){
  const dx = P2.x-P1.x, dy = P2.y-P1.y, len = Math.hypot(dx,dy);
  let nx = -dy/len, ny = dx/len;
  const mx = (P1.x+P2.x)/2, my = (P1.y+P2.y)/2;
  const toOpp = { x: oppVertex.x-mx, y: oppVertex.y-my };
  if(nx*toOpp.x + ny*toOpp.y > 0){ nx = -nx; ny = -ny; }
  const P3 = { x:P2.x+nx*len, y:P2.y+ny*len };
  const P4 = { x:P1.x+nx*len, y:P1.y+ny*len };
  return [P1,P2,P3,P4].map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
}

function helpDiagram(q){
  const A = {x:60, y:200}, R = {x:250, y:200}, T = {x:250, y:70};

  if(q.kind === 'label'){
    // always show the canonical (unrotated) orientation as a fixed reference key,
    // regardless of the actual question's random orientation
    return `
    <svg viewBox="0 0 400 300" width="100%" height="220">
      <line x1="${A.x}" y1="${A.y}" x2="${T.x}" y2="${T.y}" stroke="var(--cyan)" stroke-width="2.5"/>
      <line x1="${A.x}" y1="${A.y}" x2="${R.x}" y2="${R.y}" stroke="var(--cyan)" stroke-width="2.5"/>
      <line x1="${R.x}" y1="${R.y}" x2="${T.x}" y2="${T.y}" stroke="var(--cyan)" stroke-width="2.5"/>
      <rect x="${R.x-14}" y="${R.y-14}" width="14" height="14" fill="none" stroke="var(--paper-dim)" stroke-width="1.5"/>
      <text x="${A.x-14}" y="${A.y+16}" text-anchor="middle" font-size="14" fill="var(--paper-dim)" font-weight="700">A</text>
      <text x="${R.x+14}" y="${R.y+16}" text-anchor="middle" font-size="14" fill="var(--paper-dim)" font-weight="700">C</text>
      <text x="${T.x+14}" y="${T.y-8}" text-anchor="middle" font-size="14" fill="var(--paper-dim)" font-weight="700">B</text>
      <text x="${(A.x+T.x)/2-30}" y="${(A.y+T.y)/2-6}" text-anchor="middle" font-size="12" fill="var(--ok)" font-weight="600">c = hypotenusen</text>
      <text x="${(A.x+R.x)/2}" y="${A.y+30}" text-anchor="middle" font-size="12" fill="var(--ok)" font-weight="600">b = hosliggende (til A)</text>
      <text x="${R.x+10}" y="${(R.y+T.y)/2}" text-anchor="start" font-size="12" fill="var(--ok)" font-weight="600">a = modstående (til A)</text>
    </svg>`;
  }

  if(q.kind === 'pyth'){
    const sqB = outwardSquare(A,R,T);   // on the horizontal leg
    const sqA = outwardSquare(R,T,A);   // on the vertical leg
    const sqC = outwardSquare(A,T,R);   // on the hypotenuse
    return `
    <svg viewBox="0 0 400 300" width="100%" height="220">
      <polygon points="${sqB}" class="sq sq-b" fill="var(--amber)" fill-opacity="0.22" stroke="var(--amber)" stroke-width="1.5"/>
      <polygon points="${sqA}" class="sq sq-a" fill="var(--amber)" fill-opacity="0.22" stroke="var(--amber)" stroke-width="1.5"/>
      <polygon points="${sqC}" class="sq sq-c" fill="var(--ok)" fill-opacity="0.22" stroke="var(--ok)" stroke-width="1.5"/>
      <line x1="${A.x}" y1="${A.y}" x2="${T.x}" y2="${T.y}" stroke="var(--cyan)" stroke-width="2.5"/>
      <line x1="${A.x}" y1="${A.y}" x2="${R.x}" y2="${R.y}" stroke="var(--cyan)" stroke-width="2.5"/>
      <line x1="${R.x}" y1="${R.y}" x2="${T.x}" y2="${T.y}" stroke="var(--cyan)" stroke-width="2.5"/>
      <rect x="${R.x-14}" y="${R.y-14}" width="14" height="14" fill="none" stroke="var(--paper-dim)" stroke-width="1.5"/>
      <text x="150" y="196" text-anchor="middle" font-size="14" fill="var(--paper)" font-weight="600">b</text>
      <text x="270" y="140" text-anchor="start" font-size="14" fill="var(--paper)" font-weight="600">a</text>
      <text x="140" y="130" text-anchor="middle" font-size="14" fill="var(--paper)" font-weight="600">c</text>
      ${vertexLabels(A,R,T,13)}
      <text x="200" y="255" text-anchor="middle" font-size="16" fill="var(--ok)" font-weight="700" class="pyth-label">a² + b² = c²</text>
    </svg>`;
  }

  const pulse = { sin:['hyp','opposite'], cos:['hyp','adjacent'], tan:['adjacent','opposite'] }[q.fn];
  const isOn = role => pulse.includes(role);
  const col = role => isOn(role) ? 'var(--amber)' : 'var(--cyan-dim)';
  const cls = role => isOn(role) ? 'help-pulse' : '';

  return `
  <svg viewBox="0 0 400 300" width="100%" height="220">
    <line x1="${A.x}" y1="${A.y}" x2="${T.x}" y2="${T.y}" class="${cls('hyp')}" stroke="${col('hyp')}" stroke-width="2.5"/>
    <line x1="${A.x}" y1="${A.y}" x2="${R.x}" y2="${R.y}" class="${cls('adjacent')}" stroke="${col('adjacent')}" stroke-width="2.5"/>
    <line x1="${R.x}" y1="${R.y}" x2="${T.x}" y2="${T.y}" class="${cls('opposite')}" stroke="${col('opposite')}" stroke-width="2.5"/>
    <rect x="${R.x-14}" y="${R.y-14}" width="14" height="14" fill="none" stroke="var(--paper-dim)" stroke-width="1.5"/>
    <path d="M ${A.x+26} ${A.y} A 26 26 0 0 0 ${A.x+20} ${A.y-16}" class="help-pulse" fill="none" stroke="var(--amber)" stroke-width="1.5"/>
    <text x="${A.x+34}" y="${A.y-8}" class="help-pulse" font-size="14" fill="var(--amber)" font-weight="600">${q.targetRole === 'angleA' ? '?' : 'A'}</text>
    <text x="${(A.x+T.x)/2-20}" y="${(A.y+T.y)/2-8}" text-anchor="middle" font-size="13" fill="${col('hyp')}" font-weight="600">hypotenuse</text>
    <text x="${(A.x+R.x)/2}" y="${A.y+22}" text-anchor="middle" font-size="13" fill="${col('adjacent')}" font-weight="600">hosliggende</text>
    <text x="${R.x+10}" y="${(R.y+T.y)/2}" text-anchor="start" font-size="13" fill="${col('opposite')}" font-weight="600">modstående</text>
    ${vertexLabels(A,R,T,13)}
    <circle cx="${A.x}" cy="${A.y}" r="3" fill="var(--paper)"/>
    <circle cx="${R.x}" cy="${R.y}" r="3" fill="var(--paper)"/>
    <circle cx="${T.x}" cy="${T.y}" r="3" fill="var(--paper)"/>
  </svg>`;
}

/* the equation set up with the actual numbers of the question — shown at the bottom of the help box */
function setupLine(q){
  if(q.kind === 'pyth'){
    const g = q.given;
    if(q.targetRole === 'hyp') return `c² = ${g.opposite}² + ${g.adjacent}² &nbsp;⇒&nbsp; c = √(${g.opposite}² + ${g.adjacent}²)`;
    const leg = g.opposite !== undefined ? g.opposite : g.adjacent;
    return `${leg}² + ?² = ${g.hyp}² &nbsp;⇒&nbsp; ? = √(${g.hyp}² − ${leg}²)`;
  }
  const top = { sin:'opposite', cos:'adjacent', tan:'opposite' }[q.fn];
  const bottom = { sin:'hyp', cos:'hyp', tan:'adjacent' }[q.fn];
  if(q.targetRole === 'angleA'){
    return `${q.fn}(A) = ${q.given[top]} / ${q.given[bottom]} &nbsp;⇒&nbsp; A = ${q.fn}⁻¹(${q.given[top]} / ${q.given[bottom]})`;
  }
  const a = `${q.fn}(${q.angle}°)`;
  if(q.targetRole === top){
    return `${a} = ? / ${q.givenVal} &nbsp;⇒&nbsp; ? = ${q.givenVal} · ${a}`;
  }
  return `${a} = ${q.givenVal} / ? &nbsp;⇒&nbsp; ? = ${q.givenVal} / ${a}`;
}

function helpText(q){
  if(q.kind === 'label') return helpTextBase(q);
  return helpTextBase(q) + `<div class="setup-line"><strong>Opstillet med tallene fra opgaven:</strong><br>${setupLine(q)}</div>`;
}

function helpTextBase(q){
  if(q.kind === 'label'){
    return `<strong>Hjælp:</strong> I en retvinklet trekant navngiver vi vinklerne A, B og C, hvor C altid er den rette vinkel.<br><br>
    • <strong>Hypotenusen</strong> er den længste side — den ligger altid overfor den rette vinkel (C).<br>
    • Den <strong>modstående katete</strong> til en vinkel er den side, som IKKE rører den vinkel.<br>
    • Den <strong>hosliggende katete</strong> til en vinkel er den af de to sider, der rører vinklen, og som ikke er hypotenusen.<br><br>
    Referencetrekanten ovenfor viser navngivningen i den "originale" stilling — men i selve opgaven kan trekanten være drejet eller spejlvendt, så du skal bruge princippet, ikke kun positionen på skærmen.`;
  }

  if(q.kind === 'pyth'){
    return `<strong>Hjælp:</strong> Pythagoras' sætning bruges, når du kender to sider i en retvinklet trekant og skal finde den tredje.<br>
    Formel: <strong>a² + b² = c²</strong> (c er hypotenusen, a og b er kateterne)<br><br>
    Sådan gør du:<br>
    1. Afgør om du mangler hypotenusen eller en katete.<br>
    2. Sæt de kendte tal ind i formlen, og gang hvert tal med sig selv (kvadrer).<br>
    3. Mangler du hypotenusen: læg de to kvadrattal sammen. Mangler du en katete: træk det mindste kvadrattal fra det største.<br>
    4. Tag kvadratroden af resultatet på din lommeregner for at finde den manglende side.`;
  }

  const info = {
    sin: { formel:'sin(A) = modstående / hypotenuse', sider:'hypotenusen og den modstående katete' },
    cos: { formel:'cos(A) = hosliggende / hypotenuse', sider:'hypotenusen og den hosliggende katete' },
    tan: { formel:'tan(A) = modstående / hosliggende', sider:'den modstående og den hosliggende katete' },
  }[q.fn];

  if(q.targetRole === 'angleA'){
    return `<strong>Hjælp:</strong> ${fnDaName[q.fn].charAt(0).toUpperCase()+fnDaName[q.fn].slice(1)} bruges, når opgaven handler om ${info.sider} — men her er det vinkel A, du mangler, ikke en side.<br>
    Formel: <strong>${info.formel}</strong><br><br>
    Sådan gør du:<br>
    1. Sæt de to kendte sider ind i formlen, så du får forholdet mellem dem.<br>
    2. Da du skal finde vinklen (ikke en side), skal du bruge den omvendte funktion — ${q.fn}⁻¹, som du som regel finder ved at trykke shift (eller 2nd) + ${q.fn} på lommeregneren.<br>
    3. Husk at lommeregneren skal stå på grader (DEG).<br>
    4. Beregn resultatet — det er vinkel A i grader.`;
  }

  return `<strong>Hjælp:</strong> ${fnDaName[q.fn].charAt(0).toUpperCase()+fnDaName[q.fn].slice(1)} bruges, når opgaven handler om ${info.sider}.<br>
  Formel: <strong>${info.formel}</strong><br><br>
  Sådan gør du:<br>
  1. Skriv formlen op, og sæt de tal ind, du kender fra opgaven.<br>
  2. Isolér den side eller vinkel, du mangler (flyt led over på den anden side af lighedstegnet).<br>
  3. Husk at lommeregneren skal stå på grader (DEG), når du bruger sin, cos eller tan.<br>
  4. Beregn resultatet, og afrund om nødvendigt.`;
}

/* ---------- navigation ---------- */
function goNext(){
  qIndex++;
  if(qIndex >= questions.length){
    renderDone();
  } else {
    renderQuestion();
  }
}

function renderDone(){
  taskTag.textContent = 'FÆRDIG';
  renderTicks();
  const pkgTitle = PACKAGES[currentPkgKey].title;

  const totalAttempts = results.reduce((sum,r) => sum + (r ? r.attempts : 0), 0);
  const skippedCount = results.filter(r => r && r.skipped).length;

  const summaryLine = skippedCount === 0
    ? `Alle ${questions.length} opgaver blev besvaret korrekt uden at springe nogen over. I alt ${totalAttempts} forsøg brugt.`
    : `${questions.length - skippedCount} af ${questions.length} opgaver blev besvaret korrekt, ${skippedCount} blev sprunget over. I alt ${totalAttempts} forsøg brugt.`;

  const rows = results.map((r,i)=>{
    if(!r) return '';
    const status = r.skipped
      ? `<span class="stat-status">Sprunget over</span>`
      : `<span class="stat-status">Løst</span>`;
    return `<li class="${r.skipped ? 'skipped' : ''}"><span>Opgave ${i+1}</span><span>${r.attempts} forsøg · ${status}</span></li>`;
  }).join('');

  card.innerHTML = `
    <div class="done-screen">
      <div class="stamp${skippedCount > 0 ? ' partial' : ''}">${skippedCount > 0 ? 'GENNEMFØRT' : 'BESTÅET ✓'}</div>
      <h2 class="prompt" style="text-align:center;">Du har gennemført pakken "${pkgTitle}".</h2>
      <div class="stats-summary">
        <div class="summary-line">${summaryLine}</div>
        <ul class="stats-list">${rows}</ul>
      </div>
      <div class="done-actions">
        <button class="ghost-btn" id="retryBtn">Prøv pakken igen</button>
        <button class="next-btn" id="newPkgBtn">Vælg ny pakke</button>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').addEventListener('click', ()=> activatePackage(currentPkgKey));
  document.getElementById('newPkgBtn').addEventListener('click', ()=> { location.hash = ''; });
}

/* ---------- start ---------- */
window.addEventListener('hashchange', syncFromHash);
syncFromHash();
</script>
